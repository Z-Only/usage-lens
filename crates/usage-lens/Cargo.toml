[package]
name = "usage-lens"
version = "0.4.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "Local-first AI usage evidence and an embedded loopback dashboard"
repository = "https://github.com/Z-Only/usage-lens"
publish = false

[lints]
workspace = true

[dependencies]
axum = { version = "=0.8.9", features = ["json", "query", "tokio", "http1"] }
base64 = "=0.23.1"
chrono = { version = "=0.4.45", features = ["serde"] }
clap = { version = "=4.6.7", features = ["derive"] }
getrandom = "=0.4.3"
libc = "=0.2.189"
form_urlencoded = "=1.2.2"
percent-encoding = "=2.3.2"
url = "=2.5.8"
num-bigint = "=0.5.1"
regex = "=1.13.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "=0.11.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "io-std", "io-util", "process", "time", "sync", "fs"] }

[dev-dependencies]
http-body-util = "=0.1.5"
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

[build-dependencies]
serde_json = "=1.0.151"
sha2 = "=0.11.0"
