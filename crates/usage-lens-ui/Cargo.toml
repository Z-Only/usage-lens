[package]
name = "usage-lens-ui"
version = "0.6.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ssr = ["leptos/ssr"]
csr = ["leptos/csr", "dep:wasm-bindgen-futures", "dep:gloo-net"]

[dependencies]
leptos = { version = "=0.8.21", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
num-bigint = "=0.5.1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = { version = "=0.4.79", optional = true }
gloo-net = { version = "=0.7.0", optional = true }
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element", "HtmlElement", "HtmlDialogElement", "Storage", "KeyboardEvent", "NodeList", "AbortController", "AbortSignal", "RequestCredentials"] }

[lints]
workspace = true
