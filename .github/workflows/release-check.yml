name: Release package checks
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: package-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux-x64, target: x86_64-unknown-linux-musl}
          - {runner: macos-15, platform: macos-arm64, target: aarch64-apple-darwin}
          - {runner: macos-15-intel, platform: macos-x64, target: x86_64-apple-darwin}
          - {runner: windows-2025, platform: windows-x64, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install Linux static linker from Ubuntu packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install pinned official Rust and WebAssembly tooling
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown "$RELEASE_TARGET"
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Test packaging and release safety logic
        run: python -m unittest discover -s tests/release -p 'test_*.py' -v
      - name: Build and smoke extracted native release
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/release/build.py --target "$RELEASE_PLATFORM" --commit "$SOURCE_SHA"
  package-gate:
    if: always()
    needs: [package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all four verified native packages
        env:
          RESULT: ${{ needs.package.result }}
        run: test "$RESULT" = success
